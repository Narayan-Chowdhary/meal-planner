# nginx config for the Meal Planner single-page app.
# Runs as non-root (nginx-unprivileged) on port 8080.

upstream api_upstream {
    # "api" is the json-server service name in docker-compose.yml
    server api:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # --- security headers (also re-included below; see security-headers.inc) ---
    include /etc/nginx/snippets/security-headers.inc;

    # --- liveness probe ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API proxy (same origin => no CORS) ---
    # /api/Food -> http://api:8000/Food
    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- fingerprinted build assets: cache for a year ---
    location /assets/ {
        # translation files live under /assets/locales and are NOT fingerprinted
        location /assets/locales/ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.inc;
            try_files $uri =404;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    # --- SPA: every other route falls back to index.html ---
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
